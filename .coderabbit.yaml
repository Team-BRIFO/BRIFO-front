# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'

tone_instructions: >
  항상 한국어로 리뷰를 작성해줘. 존댓말을 사용하되 장황하지 않고 간결하게,
  요점만 명확히 짚어줘. 코드 스니펫이나 diff, 식별자(변수/함수/타입명)는
  원문 그대로(영어) 유지하고 설명만 한국어로 작성해줘.

early_access: false

reviews:
  profile: 'chill'
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: false
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: '**/*'
      instructions: >
        이 프로젝트의 스택 버전: React 19, TypeScript 6, Vite(latest),
        TailwindCSS v4(@tailwindcss/vite — v3의 tailwind.config.js 기반 설정이 아닌
        CSS 우선 설정 방식), TanStack Query v5, Zustand v5, React Router DOM v7,
        Zod v4, ESLint 9(flat config), pnpm. 이 버전들을
        기준으로 리뷰하고, 구버전 API/문법(예: React Router v6 이하의 useHistory,
        Tailwind v3 전용 설정 방식, React 18 이하 관례 등)을 최신 표준이라고 착각해
        지적하지 않도록 주의해줘.

    - path: 'src/api/**/*.ts'
      instructions: >
        OpenAPI endpoint와 schema는 src/api/generated에서 Orval로 생성한다.
        컴포넌트는 axios를 직접 호출하지 않고 useApiQuery/useApiMutation 기반의
        도메인·페이지 hook을 통해 요청해야 한다. 인증·timeout·401 처리는
        src/api/client/axiosInstance.ts를 사용하며, 별도 axios 인스턴스 생성은 지적해줘.

    - path: 'src/components/**/*.tsx'
      instructions: >
        컴포넌트는 common, domain, feature, feedback 역할로 구분한다. 최상위에 바로
        컴포넌트 파일이 추가되지 않았는지 확인해줘. 컴포넌트명은 PascalCase, 파일명은
        export하는 컴포넌트명과 동일해야 한다. Tailwind 임의 hex 값(예: bg-[#ffffff])
        대신 프로젝트 디자인 토큰(BRIFO 디자인 시스템 색상/폰트 토큰) 사용을 권장해줘.

    - path: 'src/pages/**/*.tsx'
      instructions: >
        페이지 컴포넌트는 pages/{도메인}/XxxPage.tsx 구조를 따라야 한다. 라우트 경로는
        src/routes/paths.ts의 PATH 상수를 사용해야 하며, 문자열 경로 하드코딩이
        있으면 지적해줘.

    - path: 'src/routes/**/*.tsx'
      instructions: >
        Router의 path 정의도 src/routes/paths.ts의 PATH 상수로 관리해야 한다.
        동적 라우트는 `..._ROUTE` 패턴 상수로, 화면 이동 URL은 인자를 받는 함수로
        분리했는지 확인해줘.

    - path: 'src/stores/**/*.ts'
      instructions: >
        클라이언트 전역 상태는 Zustand로 관리한다. 인증 등 영속성이 필요한 상태는
        persist 미들웨어를 사용하는지 확인해줘. 서버에서 오는 데이터(API 응답)를
        Zustand에 그대로 캐싱하려는 패턴이 보이면, TanStack Query로 옮기는 것을
        제안해줘.

    - path: 'src/**/*.{ts,tsx}'
      instructions: >
        React Query query key는 src/hooks/queries/{domain} 또는 페이지 전용 hooks의
        query key factory로 관리한다. 컴포넌트·훅에서 인라인 배열(예: ['agents', 'mine'])을
        직접 쓰는 코드가 있으면 해당 factory를 사용하도록 지적해줘.

    - path: 'src/**/*.{ts,tsx}'
      instructions: >
        - Import 경로는 상대경로(../../) 대신 `@/` alias를 사용해야 한다.
        - 타입/인터페이스는 `import type`으로 분리해서 가져와야 한다.
        - 커스텀 훅은 `use` 접두사 + camelCase, 컴포넌트/타입은 PascalCase,
          함수/변수는 camelCase, 상수는 UPPER_SNAKE_CASE 또는 `as const`를 따라야 한다.
        - Vite 환경 변수는 `VITE_` 접두사가 있어야 하며, `.env` 파일이 커밋 diff에
          포함되어 있다면 반드시 지적해줘.

  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: ''

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: 'auto'
